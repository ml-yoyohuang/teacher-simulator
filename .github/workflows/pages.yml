name: Build and deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test game rules
        run: pnpm test
      - name: Build deployment
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Check deployed files and share metadata
        run: node scripts/check-pages.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Check local music assets
        run: node scripts/check-music.mjs
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
