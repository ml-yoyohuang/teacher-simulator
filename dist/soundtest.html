<body><main><header><a href="./index.html">← 回到遊戲</a><p class="eyebrow">DONGSHAN · SOUND LIBRARY</p><h1>校園的聲音</h1><p>逐一試聽遊戲裡的所有音效與背景音樂。點擊即啟用音訊；每次選擇會停止上一段。</p></header><section class="toolbar" aria-label="播放控制"><label>音樂音量 <input id="music-volume" type="range" min="0" max="100" value="60"></label><label>音效音量 <input id="sfx-volume" type="range" min="0" max="100" value="70"></label><button id="stop">停止播放</button><p id="status" role="status" aria-live="polite">尚未播放</p></section><section><h2>背景音樂 <span id="music-count"></span></h2><p>日常探索依序輪播四首快板校歌；此頁可單獨完整試聽每首。三首場景變奏由快板校歌 1 改編，合唱仍為原有 32 拍合成曲段。</p><div id="music-list" class="cards"></div></section><section><h2>事件音效 <span id="sfx-count"></span></h2><div id="sfx-list" class="cards"></div></section><footer>使用者提供的配樂、場景混音變奏與原創合成音效，共用遊戲音訊引擎。此頁不讀取或修改遊戲存檔；切換到背景時會停止播放。</footer></main></body></html>
