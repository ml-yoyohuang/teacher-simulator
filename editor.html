<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234c42"><title>東山校園 · 場景佈置編輯器</title></head><body><main class="editor"><header class="editor-head"><div><p class="eyebrow">DONGSHAN · SCENE EDITOR</p><h1>校園佈置編輯器</h1><p>選場景與物件，在平面圖上拖曳；右邊可看遊戲的實際 3D 畫面。</p><p class="scope">可調整校園固定家具、初始道具、可破壞家具與文字招牌的位置。人物、牆、任務目標與校事會議室佈置由玩法控制，暫不在此編輯。</p></div><a href="./index.html">← 回到遊戲</a></header><div class="toolbar"><label>活動場景<select id="mode"></select></label><label>校園區域<select id="zone"></select></label><label>尋找物件<input id="search" type="search" placeholder="例如：課桌、麥克風"></label></div><div class="workspace"><section class="map-panel"><h2>平面圖 <small id="count"></small></h2><div class="map-wrap"><svg id="map" viewBox="0 0 620 510" role="img" aria-label="可拖曳物件的校園平面圖"></svg></div><p class="hint">點選圓點或清單項目，再拖到想要的位置。每次移動限制在原本的校園區域，以保留任務與路線。</p></section><section class="preview-panel"><h2>遊戲畫面預覽</h2><canvas id="world" aria-label="目前佈置的 3D 遊戲畫面"></canvas><p class="hint">這是目前遊戲的低多邊形模型；預覽中的人物僅供比例參考。</p></section><aside class="tools-panel"><h2>物件 <small id="object-count"></small></h2><div id="objects" class="object-list"></div><div id="selection"><p>先選一件物件。</p></div></aside></div><section class="save-panel"><div><strong id="save-state">尚無變更</strong><p>儲存後，同一瀏覽器開啟遊戲會使用新佈置。其他玩家不會自動看到；匯出設定檔後可交給開發者發布。</p></div><div class="save-actions"><button id="undo">復原</button><button id="redo">重做</button><button id="save" class="primary">儲存並套用</button><button id="export">匯出設定檔</button><button id="import">匯入設定檔</button><input id="import-file" type="file" accept="application/json,.json" hidden><button id="reset-mode">清除本活動修改</button><a class="play-link" href="./index.html" target="_blank" rel="noopener">開啟遊戲驗收 ↗</a></div></section><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="/src/scene-editor.ts"></script></body></html>
